<svg xmlns="http://www.w3.org/2000/svg" width="248" height="28" viewBox="0 0 248 28" fill="none" role="img" aria-label="Secured by AgentShield: Zero-Leak Defense">
  <title>Secured by AgentShield • Zero-Leak</title>
  <defs>
    <linearGradient id="sh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10" />
    </linearGradient>
    <filter id="sh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Capsule -->
  <rect width="248" height="28" rx="6" fill="#060913" stroke="#00F59B" stroke-opacity="0.4" stroke-width="1.2" />
  
  <!-- Left Side: Label -->
  <rect x="1" y="1" width="94" height="26" rx="5" fill="#0b101e" />
  
  <!-- Shield Icon -->
  <g transform="translate(8, 6)">
    <path d="M8 1L2 3.5V8C2 11.5 4.5 14.5 8 15.5C11.5 14.5 14 11.5 14 8V3.5L8 1Z" fill="#00F59B" fill-opacity="0.2" stroke="#00F59B" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M5.5 8L7.2 9.7L10.5 6.2" stroke="#00F59B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2">secured by</text>

  <!-- Right Side: AgentShield & Zero-Leak Status -->
  <rect x="95" y="1" width="152" height="26" rx="5" fill="#041a12" fill-opacity="0.8" />
  <circle cx="108" cy="14" r="3" fill="#00F59B" filter="url(#sh-glow)" />
  <text x="117" y="18" fill="#00F59B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">AgentShield</text>
  <text x="187" y="18" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">zero-leak</text>
  <circle cx="182" cy="14" r="1.5" fill="#34d399" fill-opacity="0.7" />
</svg>